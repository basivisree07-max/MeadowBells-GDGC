<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Little More Art, A Little More You — Meadowbell</title>
    <meta name="description" content="A painting for your walls, a story for your space, and a little art for your soul — Meadowbell." />
    <meta property="og:title" content="A Little More Art, A Little More You — Meadowbell" />
    <meta property="og:description" content="A painting for your walls, a story for your space, and a little art for your soul — Meadowbell." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-hosted & Google Fonts fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Self-hosted latin woff2 font declarations */
      @font-face {
        font-family: 'Grandstander';
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url('/fonts/grandstander-900.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-400.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/inter-500.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Base Reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --u: calc(100vw / 1440);
        --green-text: #5b875c;
        --headline-shadow: 0 calc(4 * var(--u)) calc(18 * var(--u)) rgba(28, 70, 120, 0.28);
      }

      html, body {
        width: 100%;
        min-height: 100%;
        background-color: #5ea3d8;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: #ffffff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* The 1440x1280 frame (9:8 ratio) */
      .hero-frame {
        position: relative;
        width: 100vw;
        height: calc(1280 * var(--u));
        overflow: hidden;
        user-select: none;
      }

      /* Scene: plate + looping overlay video */
      .scene-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
      }

      .scene-plate {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Lay video over plate at 100% width, 112.5% height, top -6.25% */
      .scene-video {
        position: absolute;
        left: 0;
        width: 100%;
        height: 112.5%;
        top: -6.25%;
        object-fit: fill;
        pointer-events: none;
      }

      /* UI container */
      .ui-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* ========================================================
         NAV
         ======================================================== */
      /* Logo: "Meadowbell" 29.5px with small white two-leaf sprout icon, at (31, 23) */
      .logo {
        position: absolute;
        left: calc(31 * var(--u));
        top: calc(23 * var(--u));
        display: inline-flex;
        align-items: center;
        gap: calc(8 * var(--u));
        font-family: 'Grandstander', sans-serif;
        font-weight: 900;
        font-size: calc(29.5 * var(--u));
        line-height: 1;
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        z-index: 30;
        text-shadow: 0 calc(2 * var(--u)) calc(8 * var(--u)) rgba(28, 70, 120, 0.24);
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .logo:hover {
        transform: translateY(calc(-2 * var(--u)));
      }

      .sprout-svg {
        width: calc(26 * var(--u));
        height: calc(26 * var(--u));
        fill: #ffffff;
        display: block;
        flex-shrink: 0;
      }

      /* Top Nav Sign In button: white pill, 105x45 at (1311, 14), green Inter 500 18.5px */
      .nav-join-btn {
        position: absolute;
        left: calc(1311 * var(--u));
        top: calc(14 * var(--u));
        width: calc(105 * var(--u));
        height: calc(45 * var(--u));
        border-radius: calc(22.5 * var(--u));
        background: #ffffff;
        color: var(--green-text);
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: calc(18.5 * var(--u));
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border: none;
        cursor: pointer;
        z-index: 30;
        box-shadow: 0 calc(4 * var(--u)) calc(12 * var(--u)) rgba(28, 70, 120, 0.16);
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
      }
      .nav-join-btn:hover {
        transform: translateY(calc(-2 * var(--u)));
        box-shadow: 0 calc(6 * var(--u)) calc(16 * var(--u)) rgba(28, 70, 120, 0.24);
      }

      /* Active logged in user badge in nav (hidden by default) */
      .nav-user-badge {
        display: none;
        position: absolute;
        left: calc(1250 * var(--u));
        top: calc(13 * var(--u));
        height: calc(46 * var(--u));
        padding: 0 calc(16 * var(--u));
        border-radius: calc(23 * var(--u));
        background: rgba(255, 255, 255, 0.95);
        color: #2e5533;
        font-size: calc(16 * var(--u));
        font-weight: 600;
        align-items: center;
        gap: calc(8 * var(--u));
        z-index: 30;
        box-shadow: 0 calc(4 * var(--u)) calc(14 * var(--u)) rgba(0, 0, 0, 0.15);
      }
      .nav-user-badge.active {
        display: inline-flex;
      }

      /* ========================================================
         COPY, CENTRED
         ======================================================== */
      /* Headline: "A LITTLE MORE ART, A LITTLE MORE YOU", Grandstander 900 */
      .headline {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(230 * var(--u));
        text-align: center;
        font-family: 'Grandstander', sans-serif;
        font-weight: 900;
        font-size: calc(88 * var(--u));
        line-height: calc(96 * var(--u));
        letter-spacing: -0.015em;
        color: #ffffff;
        text-shadow: var(--headline-shadow);
        z-index: 20;
        pointer-events: none;
      }

      .headline-line {
        display: inline-block;
        transform-origin: center bottom;
      }

      /* Subline: Inter 400 */
      .subline {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(450 * var(--u));
        text-align: center;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: calc(22 * var(--u));
        line-height: calc(32 * var(--u));
        color: #ffffff;
        text-shadow: 0 calc(2 * var(--u)) calc(8 * var(--u)) rgba(28, 70, 120, 0.22);
        z-index: 20;
        pointer-events: none;
        max-width: calc(860 * var(--u));
        margin: 0 auto;
      }

      /* ========================================================
         LOGIN BUTTONS (Replacing Join Us & Preview)
         ======================================================== */
      /* Login as Customer: white pill with green text, placed at (491, 555) */
      .btn-login-customer {
        position: absolute;
        left: calc(491 * var(--u));
        top: calc(555 * var(--u));
        width: calc(236 * var(--u));
        height: calc(58 * var(--u));
        border-radius: calc(29 * var(--u));
        background: #ffffff;
        color: var(--green-text);
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: calc(20 * var(--u));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: calc(10 * var(--u));
        text-decoration: none;
        border: none;
        cursor: pointer;
        z-index: 30;
        box-shadow: 0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(28, 70, 120, 0.18);
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, background-color 0.2s;
      }
      .btn-login-customer:hover {
        transform: translateY(calc(-2 * var(--u)));
        box-shadow: 0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(28, 70, 120, 0.25);
        background: #fbfdfb;
      }

      /* Login as Admin: translucent mint pill with blur, placed at (745, 555) */
      .btn-login-admin {
        position: absolute;
        left: calc(745 * var(--u));
        top: calc(555 * var(--u));
        width: calc(204 * var(--u));
        height: calc(58 * var(--u));
        border-radius: calc(29 * var(--u));
        background: rgba(204, 218, 173, 0.65);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: calc(20 * var(--u));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: calc(10 * var(--u));
        text-decoration: none;
        border: none;
        cursor: pointer;
        z-index: 30;
        box-shadow: 0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(18, 48, 30, 0.15);
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, background-color 0.25s;
      }
      .btn-login-admin:hover {
        transform: translateY(calc(-2 * var(--u)));
        background: rgba(204, 218, 173, 0.78);
        box-shadow: 0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(18, 48, 30, 0.22);
      }

      .btn-icon-svg {
        width: calc(19 * var(--u));
        height: calc(19 * var(--u));
        flex-shrink: 0;
      }

      /* Notification toast */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #25442e;
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 500;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        z-index: 2000;
        opacity: 0;
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      /* Modal Dialog */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(14, 30, 20, 0.65);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        padding: 20px;
      }
      .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-window {
        background: #ffffff;
        color: #243c2c;
        max-width: 520px;
        width: 100%;
        border-radius: 26px;
        padding: 34px 30px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
        transform: scale(0.92);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
      }
      .modal-backdrop.open .modal-window {
        transform: scale(1);
      }
      .modal-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #f0f4f1;
        border: none;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #55705b;
        transition: background 0.2s;
      }
      .modal-close:hover {
        background: #e2ede4;
      }

      /* Form inputs */
      .auth-input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
        text-align: left;
      }
      .auth-label {
        font-size: 13.5px;
        font-weight: 600;
        color: #3b5a43;
      }
      .auth-input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1.5px solid #d4e2d6;
        font-size: 15px;
        color: #223a29;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .auth-input:focus {
        border-color: #5b875c;
        box-shadow: 0 0 0 3px rgba(91, 135, 92, 0.15);
      }

      /* ========================================================
         Phones (≤ 820px) Mobile Overrides
         ======================================================== */
      @media (max-width: 820px) {
        :root {
          --u: 1px;
        }

        .hero-frame {
          width: 100%;
          height: auto;
          min-height: 100vh;
          overflow: visible;
          display: flex;
          flex-direction: column;
          position: relative;
        }

        /* Scene: 9:8 plate and video sit in one 9:8 box sized to the hero's height and shifted so the boy and dog stay in view (left 18%, translateX(-18%)) */
        .scene-container {
          position: fixed;
          top: 0;
          left: 18%;
          transform: translateX(-18%);
          height: 100vh;
          aspect-ratio: 9 / 8;
          width: auto;
          pointer-events: none;
          z-index: 0;
        }

        .scene-plate {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .scene-video {
          width: 100%;
          height: 112.5%;
          top: -6.25%;
          left: 0;
          object-fit: fill;
        }

        .ui-container {
          position: relative;
          inset: auto;
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          padding: 18px 20px 48px;
          z-index: 10;
        }

        /* Nav: compact, with the logo and Login button */
        .mobile-nav-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          width: 100%;
          position: relative;
          margin-bottom: 32px;
        }

        .logo {
          position: static;
          font-size: 24px;
        }
        .sprout-svg {
          width: 22px;
          height: 22px;
        }


        .nav-join-btn {
          position: static;
          width: 88px;
          height: 38px;
          font-size: 15px;
          border-radius: 19px;
        }

        .nav-user-badge {
          position: static;
          height: 38px;
          font-size: 14px;
        }

        /* Copy: stacked and centred in flow, with headline at 51px */
        .mobile-copy-block {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          margin-top: 24px;
          margin-bottom: auto;
        }

        .headline {
          position: static;
          font-size: 34px;
          line-height: 38px;
          margin-bottom: 16px;
        }

        .subline {
          position: static;
          font-size: 15.5px;
          line-height: 23px;
          max-width: 360px;
          margin-bottom: 28px;
        }

        .mobile-buttons-row {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          width: 100%;
          max-width: 320px;
        }

        .btn-login-customer {
          position: static;
          width: 100%;
          height: 52px;
          font-size: 17px;
          border-radius: 26px;
          box-shadow: 0 4px 16px rgba(28, 70, 120, 0.2);
        }

        .btn-login-admin {
          position: static;
          width: 100%;
          height: 52px;
          font-size: 17px;
          border-radius: 26px;
          box-shadow: 0 4px 16px rgba(18, 48, 30, 0.18);
        }

        .btn-icon-svg {
          width: 18px;
          height: 18px;
        }
      }

      /* Reduced motion: no video and no transitions */
      @media (prefers-reduced-motion: reduce) {
        .scene-video {
          display: none !important;
        }
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 1440x1280 Hero Frame (9:8) -->
    <main class="hero-frame" id="heroFrame">
      <!-- Scene: 9:8 Plate + Looping Video Overlay -->
      <div class="scene-container" id="sceneContainer">
        <!-- 9:8 Background Plate (2160x1920) -->
        <img
          class="scene-plate"
          src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3ca5d10d-ea2f-4907-876f-33bde169469e.jpg"
          alt="Sunny hillside afternoon with a boy and beagle looking up at cumulus clouds, valley on the right"
          width="2160"
          height="1920"
        />

        <!-- Looping video overlay: 100% width, 112.5% height, top -6.25% -->
        <video
          class="scene-video"
          id="sceneVideo"
          autoplay
          loop
          muted
          playsinline
          disablepictureinpicture
          preload="auto"
          aria-hidden="true"
        >
          <source
            src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d2cb5bef-f92b-4e91-ae93-8dc6555e56ac.mp4"
            type="video/mp4"
          />
        </video>
      </div>

      <!-- UI Layer -->
      <div class="ui-container" id="uiContainer">
        <!-- Nav Header -->
        <header class="mobile-nav-bar">
          <!-- Logo: "Meadowbell" 29.5px with small white two-leaf sprout icon, at (31, 23) -->
          <a href="#" class="logo" id="logoElem" aria-label="Meadowbell homepage">
            <svg class="sprout-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 22V10" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" />
              <path d="M12 10C12 5.5 8 4 4 4C4 8.5 7.5 12 12 10Z" fill="#ffffff" />
              <path d="M12 13C12 9 15.5 7 20 7C20 11.5 16.5 14.5 12 13Z" fill="#ffffff" />
            </svg>
            <span>Meadowbell</span>
          </a>


          <!-- Top Nav Login / Portal button: white pill, 105x45 at (1311, 14), green Inter 500 18.5px -->
          <button class="nav-join-btn" id="navJoinBtn" type="button" aria-label="Open Login Portal">
            Login
          </button>

          <!-- Active User Badge (shown when logged in) -->
          <div class="nav-user-badge" id="navUserBadge">
            <span id="navUserName">Neighbor</span>
            <button id="navSignOutBtn" type="button" style="background:none; border:none; color:#c24b38; cursor:pointer; font-size:12px; font-weight:700; margin-left:4px;">(Sign Out)</button>
          </div>
        </header>

        <!-- Centered Copy Block -->
        <div class="mobile-copy-block">
          <!-- Headline: "A LITTLE MORE ART, A LITTLE MORE YOU" in Grandstander 900 -->
          <h1 class="headline" id="headlineElem">
            <span class="headline-line" id="hlLine1">A LITTLE MORE ART,</span><br />
            <span class="headline-line" id="hlLine2">A LITTLE MORE YOU</span>
          </h1>

          <!-- Subline: Inter 400 -->
          <p class="subline" id="sublineElem">
            A painting for your walls, a story for your space, and a little art for your soul.
          </p>

          <!-- Buttons: Login as Customer and Login as Admin -->
          <div class="mobile-buttons-row">
            <!-- Login as Customer: white pill, green text -->
            <button class="btn-login-customer" id="btnLoginCustomer" type="button">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#5b875c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <span>Login as Customer</span>
            </button>

            <!-- Login as Admin: translucent mint pill with blur, white text -->
            <button class="btn-login-admin" id="btnLoginAdmin" type="button">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <span>Login as Admin</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Interactive Dialog Modal -->
    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-window">
        <button class="modal-close" id="modalCloseBtn" aria-label="Close dialog">&times;</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toastMessage" role="status" aria-live="polite"></div>

    <!-- Vanilla JS: Entrance Timeline with Web Animations API & Login Flows -->
    <script>
      (function() {
        const logo = document.getElementById('logoElem');
        const navJoinBtn = document.getElementById('navJoinBtn');
        const hlLine1 = document.getElementById('hlLine1');
        const hlLine2 = document.getElementById('hlLine2');
        const subline = document.getElementById('sublineElem');
        const btnLoginCustomer = document.getElementById('btnLoginCustomer');
        const btnLoginAdmin = document.getElementById('btnLoginAdmin');
        const sceneVideo = document.getElementById('sceneVideo');
        const navUserBadge = document.getElementById('navUserBadge');
        const navUserName = document.getElementById('navUserName');
        const navSignOutBtn = document.getElementById('navSignOutBtn');

        // State
        let currentUser = null;

        // Check reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (prefersReducedMotion) {
          if (sceneVideo) {
            sceneVideo.pause();
            sceneVideo.style.display = 'none';
          }
        } else {
          // Entrance Timeline (Web Animations API, run once)
          const entranceTargets = [
            logo, navJoinBtn,
            hlLine1, hlLine2,
            subline,
            btnLoginCustomer, btnLoginAdmin
          ];

          entranceTargets.forEach(function(el) {
            if (el) el.style.opacity = '0';
          });

          // 1. Logo, nav, and Login button drop in
          const dropInKeyframes = [
            { opacity: 0, transform: 'translateY(-24px)' },
            { opacity: 1, transform: 'translateY(0)' }
          ];
          const dropInOpts = {
            duration: 700,
            easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
            fill: 'forwards'
          };

          if (logo) logo.animate(dropInKeyframes, { ...dropInOpts, delay: 50 });
          if (navJoinBtn) navJoinBtn.animate(dropInKeyframes, { ...dropInOpts, delay: 190 });



          // 3. Each headline line springs up out of a blur, 0.16s apart
          const springHeadlineKeyframes = [
            { opacity: 0, filter: 'blur(16px)', transform: 'translateY(36px) scale(0.96)' },
            { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0) scale(1)' }
          ];
          const springOpts = {
            duration: 900,
            easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.15)',
            fill: 'forwards'
          };

          const tHeadline = 400;
          if (hlLine1) {
            hlLine1.animate(springHeadlineKeyframes, { ...springOpts, delay: tHeadline });
          }
          if (hlLine2) {
            hlLine2.animate(springHeadlineKeyframes, { ...springOpts, delay: tHeadline + 160 });
          }

          // 4. Then subline and both login buttons rise in turn
          const riseKeyframes = [
            { opacity: 0, transform: 'translateY(22px)' },
            { opacity: 1, transform: 'translateY(0)' }
          ];
          const riseOpts = {
            duration: 720,
            easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
            fill: 'forwards'
          };

          if (subline) subline.animate(riseKeyframes, { ...riseOpts, delay: 800 });
          if (btnLoginCustomer) btnLoginCustomer.animate(riseKeyframes, { ...riseOpts, delay: 940 });
          if (btnLoginAdmin) btnLoginAdmin.animate(riseKeyframes, { ...riseOpts, delay: 1030 });
        }

        // Ensure looping video starts smoothly
        if (sceneVideo) {
          const playPromise = sceneVideo.play();
          if (playPromise !== undefined) {
            playPromise.catch(function() {
              window.addEventListener('pointerdown', function() {
                sceneVideo.play().catch(function() {});
              }, { once: true });
            });
          }
        }

        // Toast notification helper
        const toast = document.getElementById('toastMessage');
        let toastTimeout;
        function showToast(msg) {
          if (!toast) return;
          toast.textContent = msg;
          toast.classList.add('show');
          clearTimeout(toastTimeout);
          toastTimeout = setTimeout(function() {
            toast.classList.remove('show');
          }, 4000);
        }

        // Modal Helpers
        const backdrop = document.getElementById('modalBackdrop');
        const modalContent = document.getElementById('modalContent');
        const closeBtn = document.getElementById('modalCloseBtn');

        function openModal(html) {
          if (!backdrop || !modalContent) return;
          modalContent.innerHTML = html;
          backdrop.classList.add('open');
          backdrop.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
          if (!backdrop) return;
          backdrop.classList.remove('open');
          backdrop.setAttribute('aria-hidden', 'true');
        }

        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (backdrop) {
          backdrop.addEventListener('click', function(e) {
            if (e.target === backdrop) closeModal();
          });
        }
        window.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') closeModal();
        });

        // Update nav badge based on current login
        function setLoggedInUser(role, name) {
          currentUser = { role: role, name: name };
          if (navUserBadge && navJoinBtn) {
            navJoinBtn.style.display = 'none';
            navUserBadge.classList.add('active');
            navUserName.textContent = role === 'admin' ? '🛡️ Admin: ' + name : '🌱 ' + name;
          }
        }

        function signOut() {
          currentUser = null;
          if (navUserBadge && navJoinBtn) {
            navUserBadge.classList.remove('active');
            navJoinBtn.style.display = 'flex';
          }
          showToast('Signed out of Meadowbell portal.');
        }

        if (navSignOutBtn) {
          navSignOutBtn.addEventListener('click', signOut);
        }

        // Customer Login Modal
        function showCustomerLogin() {
          openModal(`
            <div>
              <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
                <div style="width: 52px; height: 52px; border-radius: 50%; background: #eaf3eb; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5b875c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </div>
                <div>
                  <h3 style="font-family: 'Grandstander', sans-serif; font-weight: 900; font-size: 26px; color: #243c2c; line-height: 1.1;">
                    Customer Login
                  </h3>
                  <p style="font-size: 14px; color: #5a7561;">
                    Welcome back to the Hollyoak Meadowbell family!
                  </p>
                </div>
              </div>

              <form id="customerLoginForm" style="display: flex; flex-direction: column;">
                <div class="auth-input-group">
                  <label class="auth-label" for="custEmail">Email or Family ID</label>
                  <input class="auth-input" id="custEmail" type="text" placeholder="e.g. barnaby@meadowbell.tv" value="clover.meadow@sproutsquad.tv" required />
                </div>

                <div class="auth-input-group">
                  <label class="auth-label" for="custPass">Password</label>
                  <input class="auth-input" id="custPass" type="password" placeholder="••••••••" value="sunflowers123" required />
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 13.5px; color: #526b58;">
                  <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" checked style="accent-color: #5b875c;" />
                    <span>Remember family login</span>
                  </label>
                  <a href="#reset" onclick="alert('Password reset link sent to registered family email.'); return false;" style="color: #436d44; text-decoration: none; font-weight: 500;">Forgot?</a>
                </div>

                <button type="submit" style="background: #5b875c; color: #ffffff; padding: 13px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 14px rgba(91,135,92,0.3); margin-bottom: 12px;">
                  Sign In as Customer
                </button>

                <div style="text-align: center; margin: 8px 0; position: relative;">
                  <hr style="border: none; border-top: 1px solid #e2ece3;" />
                  <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #ffffff; padding: 0 10px; font-size: 12px; color: #8fa694;">OR</span>
                </div>

                <button type="button" id="quickCustomerBtn" style="background: #f2f7f3; color: #3b5f42; padding: 11px; border-radius: 12px; border: 1.5px solid #d0e0d3; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                  ✨ Instant Demo Sign-In (Barnaby's Family)
                </button>
              </form>
            </div>
          `);

          const custForm = document.getElementById('customerLoginForm');
          const quickBtn = document.getElementById('quickCustomerBtn');

          function completeCustomerLogin(name) {
            setLoggedInUser('customer', name);
            closeModal();
            showToast('🌱 Welcome, ' + name + '! Customer account active.');
          }

          if (custForm) {
            custForm.addEventListener('submit', function(e) {
              e.preventDefault();
              const emailVal = document.getElementById('custEmail').value || 'Barnaby';
              const displayName = emailVal.split('@')[0] || 'Sprout Neighbor';
              completeCustomerLogin(displayName);
            });
          }

          if (quickBtn) {
            quickBtn.addEventListener('click', function() {
              completeCustomerLogin('Clover & Barnaby');
            });
          }
        }

        // Admin Login Modal
        function showAdminLogin() {
          openModal(`
            <div>
              <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
                <div style="width: 52px; height: 52px; border-radius: 50%; background: #e3ede3; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#33593b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                </div>
                <div>
                  <h3 style="font-family: 'Grandstander', sans-serif; font-weight: 900; font-size: 26px; color: #1c3624; line-height: 1.1;">
                    Admin Login
                  </h3>
                  <p style="font-size: 14px; color: #506d56;">
                    Meadowbell Series Studio & Broadcast Management
                  </p>
                </div>
              </div>

              <form id="adminLoginForm" style="display: flex; flex-direction: column;">
                <div class="auth-input-group">
                  <label class="auth-label" for="adminId">Studio Staff ID / Email</label>
                  <input class="auth-input" id="adminId" type="text" placeholder="admin@meadowbell.studio" value="producer.sarah@meadowbell.studio" required />
                </div>

                <div class="auth-input-group">
                  <label class="auth-label" for="adminKey">Studio Access Passkey</label>
                  <input class="auth-input" id="adminKey" type="password" placeholder="••••••••" value="meadow2026secure" required />
                </div>

                <div class="auth-input-group">
                  <label class="auth-label" for="adminRole">Console Department</label>
                  <select class="auth-input" id="adminRole" style="cursor: pointer; background: white;">
                    <option value="Executive Producer">Executive Producer (Full Series Control)</option>
                    <option value="Lead Animation Director">Lead Animation Director</option>
                    <option value="Kids Broadcast Manager">Kids Broadcast & Streaming Ops</option>
                  </select>
                </div>

                <button type="submit" style="background: #395c3e; color: #ffffff; padding: 13px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 14px rgba(35,66,41,0.25); margin-top: 6px; margin-bottom: 12px;">
                  Sign In as Admin
                </button>

                <div style="text-align: center; margin: 8px 0; position: relative;">
                  <hr style="border: none; border-top: 1px solid #e2ece3;" />
                  <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #ffffff; padding: 0 10px; font-size: 12px; color: #8fa694;">OR</span>
                </div>

                <button type="button" id="quickAdminBtn" style="background: #edf4ee; color: #234229; padding: 11px; border-radius: 12px; border: 1.5px solid #c9decb; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
                  🔐 Instant Demo Sign-In (Lead Producer)
                </button>
              </form>
            </div>
          `);

          const adminForm = document.getElementById('adminLoginForm');
          const quickAdminBtn = document.getElementById('quickAdminBtn');

          function completeAdminLogin(name) {
            setLoggedInUser('admin', name);
            closeModal();
            showToast('🛡️ Admin Console unlocked: Welcome, ' + name + '!');
          }

          if (adminForm) {
            adminForm.addEventListener('submit', function(e) {
              e.preventDefault();
              const idVal = document.getElementById('adminId').value || 'Studio Admin';
              const roleVal = document.getElementById('adminRole').value || 'Producer';
              completeAdminLogin(idVal.split('@')[0] + ' (' + roleVal + ')');
            });
          }

          if (quickAdminBtn) {
            quickAdminBtn.addEventListener('click', function() {
              completeAdminLogin('Sarah (Producer)');
            });
          }
        }

        // Attach Login Handlers
        if (btnLoginCustomer) btnLoginCustomer.addEventListener('click', showCustomerLogin);
        if (btnLoginAdmin) btnLoginAdmin.addEventListener('click', showAdminLogin);

        // Top Nav button handler: opens choice or customer login
        if (navJoinBtn) {
          navJoinBtn.addEventListener('click', function(e) {
            e.preventDefault();
            openModal(`
              <div style="text-align: center; padding: 6px 0;">
                <h3 style="font-family: 'Grandstander', sans-serif; font-weight: 900; font-size: 28px; color: #243c2c; margin-bottom: 8px;">
                  Choose Your Portal
                </h3>
                <p style="font-size: 15px; color: #526b58; margin-bottom: 24px;">
                  Select how you would like to sign in to Meadowbell:
                </p>
                <div style="display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto;">
                  <button id="choiceCustomerBtn" style="background: #ffffff; color: #5b875c; border: 2px solid #5b875c; padding: 13px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(91,135,92,0.12);">
                    🌱 Login as Customer
                  </button>
                  <button id="choiceAdminBtn" style="background: #5b875c; color: #ffffff; border: none; padding: 13px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(91,135,92,0.25);">
                    🛡️ Login as Admin
                  </button>
                </div>
              </div>
            `);

            const cBtn = document.getElementById('choiceCustomerBtn');
            const aBtn = document.getElementById('choiceAdminBtn');
            if (cBtn) cBtn.addEventListener('click', showCustomerLogin);
            if (aBtn) aBtn.addEventListener('click', showAdminLogin);
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
